<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The Go server replaces these two placeholders before serving the page.
      The session token never appears in a URL, a log or localStorage.
    -->
    <meta name="memctl-token" content="__MEMCTL_TOKEN__" />
    <meta name="memctl-readonly" content="__MEMCTL_READONLY__" />
    <meta name="memctl-dream-sandbox" content="__MEMCTL_DREAM_SANDBOX__" />
    <title>memctl</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
