# Builds the cross-platform release candidates and publishes a GitHub release
# for version tags. Every job calls the same entry points as a local release run
# (make test and scripts/release.sh, which `make release` combines), so the CI
# artifacts and the local candidates come from one code path.
#
# The test suite is the long pole: it is split into shards that run as parallel
# jobs, and the packaging job runs alongside them instead of after them. A
# publish job that needs both keeps a failing test from producing a release.
# See docs/04-ui-and-cli-specification.md section 6 and
# docs/05-validation-and-delivery.md section 4.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push on main cancels a queued older run; a tag run is never
# cancelled, because a half-finished release is worse than a slow one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Unit packages plus one quarter of the integration suite. scripts/test-shard.sh
  # reads the assignment from scripts/test-shards.txt, which is committed so the
  # split is reviewable and does not depend on measuring inside CI.
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.10.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the frontend
        run: make ui

      # The frontend and plugin suites take seconds, so they run once on the
      # first shard instead of four times.
      - name: Run frontend and plugin tests
        if: matrix.shard == 1
        run: |
          cd web && npm test
          cd ..
          node --test plugins/dsh/test/*.test.js
          node --test plugins/pi/test/*.test.js

      - name: Run tests
        run: scripts/test-shard.sh ${{ matrix.shard }} 4

  # Packaging does not need the test results, so it runs in parallel with the
  # shards. The publish job gates the release on both.
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # git describe needs the tag history for the version string.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.10.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The test suite runs in the verify shards; this step only builds and packs.
      - name: Build release candidates
        run: make release-dist

      - name: Upload release candidates
        uses: actions/upload-artifact@v7
        with:
          name: memctl-dist
          path: dist/
          if-no-files-found: error

  # Publishing waits for every shard and for the artifacts. On a branch or pull
  # request this job only confirms the gate passed; it never publishes.
  publish:
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # --generate-notes compares against the previous tag, so the job needs the
      # repository history even though it only uploads artifacts.
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release candidates
        uses: actions/download-artifact@v7
        with:
          name: memctl-dist
          path: dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "memctl $GITHUB_REF_NAME" \
            --generate-notes
